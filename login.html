<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEM Studio — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#080a0f; --surface:#0f1219; --panel:#141820;
    --border:#1e2535; --border2:#2a3348;
    --accent:#3de8b0; --accent-dim:rgba(61,232,176,0.10);
    --accent-glow:rgba(61,232,176,0.22);
    --red:#f04860; --text:#b8c8e0; --text-bright:#e8f0ff;
    --dim:#4a5570; --dimmer:#2a3040;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:40px 20px;position:relative;overflow:hidden;}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(61,232,176,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(61,232,176,0.025) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,black 30%,transparent 100%);}
  .glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);
    width:700px;height:500px;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse,rgba(61,232,176,0.06) 0%,transparent 65%);}
  .back-link{position:fixed;top:20px;left:24px;z-index:10;
    display:flex;align-items:center;gap:6px;
    font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
    letter-spacing:0.15em;text-transform:uppercase;color:var(--dim);
    text-decoration:none;transition:color 0.15s;}
  .back-link:hover{color:var(--accent);}
  .card{position:relative;z-index:1;width:100%;max-width:420px;
    background:var(--surface);border:1px solid var(--border2);border-radius:10px;
    overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,0.6),0 0 60px rgba(61,232,176,0.04);
    animation:slideUp 0.45s cubic-bezier(.22,1,.36,1) both;}
  @keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
  .card-header{padding:28px 32px 24px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,var(--panel) 0%,var(--surface) 100%);}
  .card-logo{display:flex;align-items:center;gap:10px;
    font-family:'Space Mono',monospace;font-size:13px;font-weight:700;
    letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;
    text-decoration:none;margin-bottom:20px;}
  .card-logo-icon{width:26px;height:26px;border:1.5px solid var(--accent);
    border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .card-title{font-size:22px;font-weight:800;color:var(--text-bright);
    letter-spacing:-0.02em;margin-bottom:4px;}
  .card-sub{font-size:12px;color:var(--dim);line-height:1.5;}
  .card-body{padding:28px 32px;}
  .field{margin-bottom:18px;}
  .field-label{display:block;margin-bottom:7px;font-family:'Space Mono',monospace;
    font-size:9px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--dim);}
  .field-input{width:100%;padding:11px 14px;background:var(--panel);
    border:1px solid var(--border2);border-radius:5px;color:var(--text-bright);
    font-family:'Syne',sans-serif;font-size:14px;outline:none;
    transition:border-color 0.15s,box-shadow 0.15s;}
  .field-input::placeholder{color:var(--dimmer);}
  .field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
  .submit-btn{width:100%;padding:13px;background:var(--accent);color:var(--bg);
    border:none;border-radius:5px;cursor:pointer;font-family:'Space Mono',monospace;
    font-size:10px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
    transition:box-shadow 0.2s,opacity 0.15s,transform 0.1s;margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:8px;}
  .submit-btn:hover:not(:disabled){box-shadow:0 0 24px var(--accent-glow);transform:translateY(-1px);}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .spinner{width:13px;height:13px;border:2px solid rgba(8,10,15,0.4);
    border-top-color:var(--bg);border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .banner{padding:11px 14px;border-radius:5px;margin-bottom:18px;
    font-size:13px;line-height:1.5;display:none;}
  .banner.error{background:rgba(240,72,96,0.1);border:1px solid rgba(240,72,96,0.3);
    color:#f79aaa;display:block;}
  .banner.success{background:rgba(61,232,176,0.1);border:1px solid rgba(61,232,176,0.3);
    color:var(--accent);display:block;}
  .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .forgot-link{font-family:'Space Mono',monospace;font-size:8px;color:var(--dim);
    text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.15s;}
  .forgot-link:hover{color:var(--accent);}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;
    color:var(--dimmer);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .signup-link{text-align:center;font-size:12px;color:var(--dim);}
  .signup-link a{color:var(--accent);text-decoration:none;font-weight:600;}
  .signup-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="glow"></div>
<a href="index.html" class="back-link">← Back to home</a>

<div class="card">
  <div class="card-header">
    <a href="index.html" class="card-logo">
      <img src="images/BEMStudio_logo.png" alt="BEM Studio" style="height:44px;width:auto;">
      BEM Studio
    </a>
    <div class="card-title">Sign in</div>
    <div class="card-sub">Welcome back — access the CFD simulator.</div>
  </div>
  <div class="card-body">
    <div class="banner" id="banner"></div>

    <div class="field">
      <label class="field-label" for="email">Email address</label>
      <input class="field-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <div class="field-row">
        <label class="field-label" for="password" style="margin-bottom:0">Password</label>
        <a href="reset.html" class="forgot-link">Forgot password?</a>
      </div>
      <input class="field-input" type="password" id="password" placeholder="Your password" autocomplete="current-password">
    </div>

    <button class="submit-btn" id="loginBtn" onclick="doLogin()">Sign In</button>

    <div class="divider">or</div>
    <div class="signup-link">New to BEM Studio? <a href="signup.html">Create an account →</a></div>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://ozcfpvwgvpclvagefhnk.supabase.co';
const SUPABASE_ANON = 'sb_publishable_DWOx7lVVcDUtrlFGjQEgbQ_uHhUistO';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const next = new URLSearchParams(location.search).get('next');
const destination = next === 'env-studio' ? 'env-studio/'
  : next === 'simulator.html' ? 'simulator.html'
  : 'launch.html';

function showBanner(msg, type) {
  const b = document.getElementById('banner');
  b.textContent = msg; b.className = 'banner ' + type;
}

// Email-confirmation landing: supabase-js reads the session from the URL
// (detectSessionInUrl) and stores it for this origin; if one exists, continue to the app.
sb.auth.onAuthStateChange((event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') &&
      /access_token|type=signup|code=/.test(location.hash + location.search)) {
    window.location.replace(destination);
  }
});

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { showBanner('Please fill in all fields.', 'error'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Signing in…';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    showBanner(error.message || 'Invalid email or password.', 'error');
    btn.disabled = false; btn.innerHTML = 'Sign In';
    return;
  }
  window.location.replace(destination);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
